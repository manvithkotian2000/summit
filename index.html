<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141A3A">
<title>Summit</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400..700&display=swap">
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" defer></script>
<script src="app1.js" defer></script>
<script src="app2.js" defer></script>
<script src="app3.js" defer></script>
<script src="app4.js" defer></script>
</head>
<body>
<main>
  <section id="today" class="screen">
    <header class="top">
      <div><p class="small muted" id="dateLine"></p><h1 id="hello">Today</h1></div>
      <span id="syncDot" class="sync off" role="img" aria-label="Sync status"></span>
    </header>
    <div id="banner"></div>
    <div class="block rings"><svg id="rings" viewBox="0 0 200 200" aria-hidden="true"></svg><div class="legend" id="ringLegend"></div></div>
    <div class="block" aria-label="Water today">
      <div class="whead">
        <p><span class="num big" id="wDrunk">0</span> <span class="muted">of <span id="wTarget">0</span> L water</span></p>
        <button class="link" id="wUndo">Undo last</button>
      </div>
      <div class="wbar"><div class="wfill" id="wFill"></div><div class="wpace" id="wPace"></div></div>
      <p class="small" id="wMsg"></p>
      <div class="wbtns"><button data-w="0.25">+250 ml</button><button data-w="0.5">+500 ml</button><button data-w="1">+1 L</button></div>
    </div>
    <h2 class="sec">Log something</h2>
    <div class="quick" id="quick"></div>
    <div class="block"><h3>Today's log</h3><div id="entryList"></div></div>
  </section>

  <section id="plan" class="screen">
    <header class="top"><h1>Your plan</h1></header>
    <div class="seg" id="seg">
      <button data-v="today" class="on">Today</button><button data-v="tomorrow">Tomorrow</button>
      <button data-v="week">Week</button><button data-v="month">Month</button>
    </div>
    <div id="planBox"></div>
    <button class="cta" id="genBtn">Make tomorrow's plan</button>
    <button class="ghost" id="rebuildBtn">Rebuild week and month</button>
  </section>

  <section id="journey" class="screen">
    <header class="jhead"><p class="small muted" id="goalLine"></p><h1 id="arrival"></h1><p class="small" id="arrivalSub"></p></header>
    <svg id="trail" viewBox="0 0 340 460" role="img" aria-label="Your position on the trail to your goal"></svg>
    <div class="block" id="chapter"></div>
    <div class="block" id="consistency"></div>
    <div class="block"><h3>Trend</h3><p class="small muted" id="trendNote"></p><div class="chartbox"><canvas id="trendCanvas"></canvas></div></div>
    <div class="block" id="wins"></div>
    <button class="ghost" id="reportBtn">Open this month's report</button>
  </section>

  <section id="me" class="screen"><header class="top"><h1>Me</h1></header><div id="meBox"></div></section>
</main>

<nav class="tabs" aria-label="Main">
  <button data-s="today" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Today</button>
  <button data-s="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 9h6M9 13h6M9 17h4"/></svg>Plan</button>
  <button data-s="journey"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 20l6-11 4 6 3-4 5 9z"/></svg>Journey</button>
  <button data-s="me"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Me</button>
</nav>
<div id="sheetWrap" class="sheet-wrap"><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div id="sheetBody"></div></div></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
